name: Keep backend warm

on:
  schedule:
    # Every 10 minutes. GitHub may delay or skip runs under load, and disables
    # scheduled workflows on a repo after 60 days with no other repo
    # activity (a push, PR, etc. resets that clock).
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health check
        run: |
          if [ -z "${{ vars.API_HEALTH_URL }}" ]; then
            echo "API_HEALTH_URL repository variable is not set. Go to Settings > Secrets and variables > Actions > Variables and add it (e.g. https://lapritel-api.vercel.app/api/health)."
            exit 1
          fi
          curl -fsS "${{ vars.API_HEALTH_URL }}"
