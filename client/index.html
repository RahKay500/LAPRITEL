<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAPRITEL | Handmade Beaded Bags</title>
    <meta
      name="description"
      content="Handmade beaded bags, crafted one bead at a time. Elegant, timeless, and made for you."
    />
    <meta name="theme-color" content="#580D0D" />

    <!-- Update these URLs once a custom domain replaces lapritel.vercel.app -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lapritel.vercel.app/" />
    <meta property="og:title" content="LAPRITEL | Handmade Beaded Bags" />
    <meta
      property="og:description"
      content="Handmade beaded bags, crafted one bead at a time. Elegant, timeless, and made for you."
    />
    <meta property="og:image" content="https://lapritel.vercel.app/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LAPRITEL | Handmade Beaded Bags" />
    <meta
      name="twitter:description"
      content="Handmade beaded bags, crafted one bead at a time. Elegant, timeless, and made for you."
    />
    <meta name="twitter:image" content="https://lapritel.vercel.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-render-blocking: the stylesheet has media="print" (so the
      browser fetches it without waiting on it to paint), then swaps to
      "all" once it's actually loaded. PageSpeed measured this request
      alone blocking first paint for ~750ms since it's a separate
      fonts.googleapis.com connection. The noscript fallback covers
      browsers with JS disabled.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <style>
      /*
        Plain CSS, no Tailwind or React dependency, so this paints on the
        very first frame -- including inside Instagram's in-app browser,
        where the JS bundle can take a moment to warm up. main.jsx removes
        this once the app has actually painted (see #splash-screen there).
      */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5e6ea;
        transition: opacity 0.4s ease;
      }
      #splash-screen.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen .splash-mark {
        font-family: "Karla", sans-serif;
        font-weight: 800;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: 0.12em;
        color: #580d0d;
      }
      #splash-screen .splash-label {
        margin-top: 0.75rem;
        font-family: "Karla", sans-serif;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(88, 13, 13, 0.6);
      }
      #splash-screen .splash-track {
        position: relative;
        margin-top: 1.25rem;
        width: 140px;
        height: 2px;
        background: rgba(88, 13, 13, 0.15);
        overflow: hidden;
        border-radius: 999px;
      }
      /*
        The standard two-segment indeterminate bar: each segment eases
        smoothly across the track, and the second one starts while the
        first is still finishing, so there's always a bar in view and no
        visible snap back to the start.
      */
      #splash-screen .splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        background: #580d0d;
        border-radius: 999px;
      }
      #splash-screen .splash-bar--1 {
        animation: splash-indeterminate-1 1.8s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
      }
      #splash-screen .splash-bar--2 {
        animation: splash-indeterminate-2 1.8s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
        animation-delay: 0.8s;
      }
      @keyframes splash-indeterminate-1 {
        0% {
          left: -35%;
          width: 35%;
        }
        60%,
        100% {
          left: 100%;
          width: 35%;
        }
      }
      @keyframes splash-indeterminate-2 {
        0% {
          left: -70%;
          width: 70%;
        }
        60%,
        100% {
          left: 100%;
          width: 70%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-screen .splash-bar {
          animation: none;
          left: 0;
          width: 100%;
        }
        #splash-screen .splash-bar--2 {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen" aria-hidden="true">
      <p class="splash-mark">LAPRITEL</p>
      <p class="splash-label">Loading</p>
      <div class="splash-track">
        <div class="splash-bar splash-bar--1"></div>
        <div class="splash-bar splash-bar--2"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
